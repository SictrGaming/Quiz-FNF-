<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Quiz Web</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html">Quiz Web Admin</a>
  <a href="../index.html">Lihat Website</a>
</header>

<main class="container">
  <div class="page-head">
    <h1>Admin Quiz</h1>
    <div class="actions">
      <button id="new-quiz" class="button">+ Quiz Baru</button>
      <button id="export-json" class="button secondary">Export JSON</button>
    </div>
  </div>

  <div class="card import-box">
    <h2>Import JSON</h2>
    <p class="muted">Pilih file JSON hasil export atau file data quiz.</p>
    <input id="import-file" type="file" accept=".json,application/json">
  </div>

  <section id="admin-list" class="admin-list"></section>

  <section id="editor" class="card hidden"></section>
</main>

<script src="../assets/js/admin.js"></script>
</body>
</html>
